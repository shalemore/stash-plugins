[project]
name = "stash-plugins"
version = "0.0.0"
description = "Stash plugins and the tooling that publishes them"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "basedpyright>=1.31.0",
    "graphql-core>=3.3.0",
    "pytest>=8.4.0",
    "pyyaml>=6.0.2",
    "ruff>=0.11.8",
    "types-pyyaml>=6.0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["scripts"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = [
    "plugins",
    "scripts",
    "tests",
]
extraPaths = ["scripts"]
exclude = [
    "**/__pycache__",
    ".venv",
]
reportMissingTypeStubs = false
