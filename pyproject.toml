[project]
name = "stash-plugins"
version = "0.0.0"
description = "Stash plugins and the tooling that publishes them"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "basedpyright>=1.31.0",
    "graphql-core>=3.3.0",
    "pytest>=8.4.0",
    "pyyaml>=6.0.2",
    "ruff>=0.11.8",
    "types-pyyaml>=6.0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts", "shared"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PIE", "PERF", "FURB", "RUF"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "recommended"
include = ["plugins", "scripts", "shared", "tests"]
extraPaths = ["scripts", "shared"]
# Stash runs each plugin's main.py as a script, so plugins import their sibling modules directly.
reportImplicitRelativeImport = false
# The formatter wraps long strings into implicitly concatenated parts.
reportImplicitStringConcatenation = false
