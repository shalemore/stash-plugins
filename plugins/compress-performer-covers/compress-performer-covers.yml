name: Compress Performer Covers
description: Compress oversized performer covers to AVIF in the background
version: 0.3.0
url: https://github.com/shalemore/stash-plugins

exec:
  - python3
  - "{pluginDir}/main.py"

interface: raw

settings:
  target_kb:
    displayName: Maximum cover size (KiB)
    description: Larger covers are compressed to fit. Defaults to 100.
    type: NUMBER

tasks:
  - name: Compress performer covers
    description: Compress every performer cover above the maximum size

hooks:
  - name: Compress new covers
    description: Queue a background job to compress a cover when a performer gets a new one
    triggeredBy:
      - Performer.Create.Post
      - Performer.Update.Post
