name: Gallery Cluster
description: Group images with similar descriptions into galleries
version: 0.2.1

url: https://github.com/shalemore/stash-plugins

exec:
  - python3
  - "{pluginDir}/main.py"

interface: raw
errLog: info

settings:
  source_tag:
    displayName: Source tag
    description: Tag name or ID. Only ungrouped images carrying this tag are grouped. Leave empty to skip all images.
    type: STRING
  gallery_tag:
    displayName: Gallery tag
    description: Tag name or ID applied to managed galleries.
    type: STRING
  similarity_threshold:
    displayName: Similarity threshold
    description: Minimum description similarity (0 to 1) to join an existing gallery. Empty or 0 uses 0.85.
    type: STRING

tasks:
  - name: Full Rebuild
    description: Group tagged ungrouped images and sync managed gallery titles, dates, covers, and empty galleries
    defaultArgs:
      dry_run: false
  - name: Dry Run
    description: Preview expected gallery groupings and updates without modifying Stash
    defaultArgs:
      dry_run: true

hooks:
  - name: Image Create
    description: Group a newly created image if it carries the source tag and has a description
    triggeredBy:
      - Image.Create.Post
    defaultArgs:
      dry_run: false
      entity_type: image
  - name: Image Update
    description: Group an updated image after its description, tags, or metadata are saved
    triggeredBy:
      - Image.Update.Post
    defaultArgs:
      dry_run: false
      entity_type: image
  - name: Image Destroy
    description: Sync managed galleries and remove empty ones when an image is deleted
    triggeredBy:
      - Image.Destroy.Post
    defaultArgs:
      dry_run: false
      entity_type: image_destroy
  - name: Gallery Update
    description: Sync managed gallery title, date, cover, and empty state after gallery updates
    triggeredBy:
      - Gallery.Update.Post
    defaultArgs:
      dry_run: false
      entity_type: gallery
