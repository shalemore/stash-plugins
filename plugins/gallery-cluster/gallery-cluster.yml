name: Gallery Cluster
description: Group images with similar descriptions into galleries
version: 0.1.0

url: https://github.com/shalemore/stash-plugins

exec:
  - python3
  - "{pluginDir}/main.py"

interface: raw
errLog: info

settings:
  path_prefixes:
    displayName: Path prefixes
    description: Comma-separated path prefixes of images to group. Leave empty to skip all images.
    type: STRING
  gallery_tag:
    displayName: Gallery tag
    description: Tag name or ID applied to managed galleries.
    type: STRING
  similarity_threshold:
    displayName: Similarity threshold
    description: Minimum description similarity (0 to 1) to join an existing gallery. Defaults to 0.85.
    type: NUMBER

tasks:
  - name: Full Rebuild
    description: Group matching ungrouped images and sync managed gallery titles, dates, covers, and empty galleries
    defaultArgs:
      dry_run: false
  - name: Dry Run
    description: Preview expected gallery groupings and updates without modifying Stash
    defaultArgs:
      dry_run: true

hooks:
  - name: Image Create
    description: Group a newly created image if it matches the configured path prefixes and has a description
    triggeredBy:
      - Image.Create.Post
    defaultArgs:
      dry_run: false
      entity_type: image
  - name: Image Update
    description: Group an updated image after its description or metadata is saved
    triggeredBy:
      - Image.Update.Post
    defaultArgs:
      dry_run: false
      entity_type: image
  - name: Image Destroy
    description: Sync managed galleries and remove empty ones when an image is deleted
    triggeredBy:
      - Image.Destroy.Post
    defaultArgs:
      dry_run: false
      entity_type: image_destroy
  - name: Gallery Update
    description: Sync managed gallery title, date, cover, and empty state after gallery updates
    triggeredBy:
      - Gallery.Update.Post
    defaultArgs:
      dry_run: false
      entity_type: gallery
